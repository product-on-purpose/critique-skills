name: Release

# Trigger: a pushed tag "v*". Re-runs ci.yml's deterministic suite as a release-time safety net
# (see AGENTS.md "Checks"), enforces the tag-equals-manifest version guard, extracts this version's
# RELEASE-NOTES.md section, and publishes a GitHub Release.
#
# Eight of ci.yml's nine jobs are re-run here, every command each of them runs. The ninth,
# build-site, is left out on purpose: a release publishes no site. The docs site is built, guarded
# and deployed from main by deploy-pages.yml, which runs build-site's own recipe, so a tag adds
# nothing to that check. smoke is here because a release is exactly what /plugin install delivers,
# and smoke is the only job that sees a fresh install (E29, release.yml's re-run parity).
#
# Follows the family pattern in agent-skills-toolkit/.github/workflows/release.yml: checkout, gate,
# guard, extract, publish. The guard reads scripts/lib/version-manifest.mjs's single enumeration of
# version-bearing files (S-07 CI-pipeline spec, deliverable 4) rather than hard-coding file paths
# inline, so it and any future version-bump tool cannot drift apart.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # agent-skills-toolkit, pinned for reproducibility; bump deliberately to adopt toolkit changes
  # (docs/internal/decisions/0011-gate-wiring-toolkit-wrapper.md). Kept identical to ci.yml's pin.
  TOOLKIT_REF: a2a54fa8551fce0af6382a5ef24ccced975edd06
  NODE_VERSION: '22.12.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the toolkit validators (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: product-on-purpose/agent-skills-toolkit
          ref: ${{ env.TOOLKIT_REF }}
          path: .agent-skills-toolkit

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install toolkit dependencies
        run: npm ci
        working-directory: .agent-skills-toolkit

      # smoke's first half must run before any pip install, because it asserts the state a new user
      # is in: no dependencies. The uninstall mirrors ci.yml's smoke job, for the same reason.
      - name: Remove jsonschema if the runner image ships it
        run: pip uninstall -y jsonschema || true

      - name: Every skill fails actionably with no dependencies installed
        run: python scripts/smoke.py --expect no-deps

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Every skill produces a usable envelope once dependencies are installed
        run: python scripts/smoke.py --expect ready

      # The rest of the deterministic suite, re-run at release time in the order ci.yml lists it.
      - name: Conformance gate
        env:
          AGENT_SKILLS_TOOLKIT: ${{ github.workspace }}/.agent-skills-toolkit
        run: npm run check

      - name: Python unit tests
        run: python -m pytest

      - name: Node unit tests
        run: npm test

      - name: Validate every bench result envelope against the contract schema
        run: npm run validate:envelopes

      - name: Regenerate the corpus from seed and verify it matches bench/corpus/
        run: python -m bench.generator verify --corpus bench/corpus

      - name: Check generated artifacts and documented commands for drift
        env:
          AGENT_SKILLS_TOOLKIT: ${{ github.workspace }}/.agent-skills-toolkit
        run: npm run gen -- --check

      - name: Audit npm dependencies
        run: node scripts/audit.mjs

      # The site tree is a separate dependency graph, which ci.yml's audit job also checks.
      - name: Audit the site's npm dependencies
        run: node scripts/audit.mjs --prefix site

      - name: Guard - tag must equal every version-bearing manifest
        run: node scripts/check-release-versions.mjs "${GITHUB_REF_NAME}"

      - name: Extract this version's RELEASE-NOTES section
        run: node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3 pinned 2026-07-26
        with:
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
