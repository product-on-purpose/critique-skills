name: CI

# Per Standard sec 4.1/4.4 and this repo's CI plan (see _local/initial-plan/04-ci-plan.md, a local
# planning archive, not shipped), this workflow contains NO validation logic of its own: every job
# that checks the repository is exactly one documented command, each reproducible locally with
# identical results (AGENTS.md "Checks"). CI is a scheduler, not a judge.
#
# Nine such jobs (S-07 CI-pipeline spec, AC-1): conformance, unit-python, unit-node, schema, corpus,
# drift, audit, smoke, build-site. Each command a job runs is marked "# doc-check";
# scripts/gen-plugin-manifest.mjs --check (the "drift" job) fails if any "# doc-check" command is
# not documented in AGENTS.md (AC-5).
#
# A tenth job, ci-ok, is the deliberate exception to every sentence above, and the only check that
# branch protection on main requires. It runs no command, checks nothing about this repository, and
# cannot be reproduced locally, because what it reports is whether the other nine passed. Its own
# comment below says why that job exists; docs/internal/decisions/0033-aggregate-ci-gate.md says why
# branch protection requires it instead of them.
#
# Node matrix: 22.12.0 (floor) and 24 (current). Python: 3.12.
#
# build-site is the NON-DEPLOYING half of family Astro site standard 14.6: it runs the same recipe
# and the same guards as deploy-pages.yml, so a green PR predicts a green deploy. It is off the
# plugin-core Node matrix on purpose and reads .nvmrc instead (14.8), because the site has one
# build environment while the core deliberately tests a floor and a ceiling.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # agent-skills-toolkit, pinned for reproducibility; bump deliberately to adopt toolkit changes
  # (docs/internal/decisions/0011-gate-wiring-toolkit-wrapper.md).
  TOOLKIT_REF: cafe6b69992146ad7fc5ae5397b6aa24dfc1176f

jobs:
  conformance:
    name: conformance (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the toolkit validators (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: product-on-purpose/agent-skills-toolkit
          ref: ${{ env.TOOLKIT_REF }}
          path: .agent-skills-toolkit

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install toolkit dependencies
        run: npm ci
        working-directory: .agent-skills-toolkit

      - name: Run conformance gate
        env:
          AGENT_SKILLS_TOOLKIT: ${{ github.workspace }}/.agent-skills-toolkit
        run: npm run check # doc-check

  unit-python:
    name: unit-python (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Python unit tests
        run: python -m pytest # doc-check

  # Does the plugin actually run for someone who just installed it?
  #
  # Every other job in this file installs dependencies before it runs anything, so none of them
  # sees what `/plugin install` delivers: a git clone and nothing else. A fresh install crashed for
  # exactly that reason, while 784 tests passed and the conformance gate was clean.
  #
  # Both user states are asserted, in order, on one runner: first with no dependencies (the state a
  # new user is in), then with them. Asserting only the second would have missed the defect this
  # job exists because of.
  smoke:
    name: smoke (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Explicit rather than assumed: if a future runner image ever ships jsonschema, the no-deps
      # assertion below would silently be testing the wrong environment.
      - name: Guarantee the dependency is absent
        run: pip uninstall -y jsonschema || true

      - name: Every skill fails actionably with no dependencies installed
        run: python scripts/smoke.py --expect no-deps # doc-check

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Every skill produces a usable envelope once dependencies are installed
        run: python scripts/smoke.py --expect ready # doc-check

  unit-node:
    name: unit-node (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Node unit tests
        run: npm test # doc-check

  schema:
    name: schema (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate every bench result envelope against the contract schema
        run: npm run validate:envelopes # doc-check

  corpus:
    name: corpus (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Regenerate the corpus from seed and verify it matches bench/corpus/
        run: python -m bench.generator verify --corpus bench/corpus # doc-check

  drift:
    name: drift (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the toolkit validators (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: product-on-purpose/agent-skills-toolkit
          ref: ${{ env.TOOLKIT_REF }}
          path: .agent-skills-toolkit

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install toolkit dependencies
        run: npm ci
        working-directory: .agent-skills-toolkit

      - name: Check generated artifacts and documented commands for drift
        env:
          AGENT_SKILLS_TOOLKIT: ${{ github.workspace }}/.agent-skills-toolkit
        run: npm run gen -- --check # doc-check

  audit:
    name: audit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Audit npm dependencies
        run: npm audit --audit-level=high # doc-check

      # The root audit passed green on every run while site/ carried one critical and three high
      # advisories, because nothing ever audited the tree that actually gets deployed. npm audit
      # reads package-lock.json directly, so this needs no install step of its own.
      - name: Audit the site's dependencies
        run: npm audit --audit-level=high --prefix site # doc-check

  build-site:
    name: build-site (Node from .nvmrc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build the site
        run: npm run build
        working-directory: site

      - name: Run the site guards
        run: node scripts/check-site.mjs # doc-check

  # The one check branch protection on main requires.
  #
  # Every job above reports a matrix-expanded name ("conformance (Node 24)"), so requiring them
  # directly means naming all fourteen, and bumping the Node matrix silently strands the old names:
  # the ruleset goes on waiting for a context that nothing will ever emit again, and every pull
  # request blocks on a check that cannot report. This job is the one stable name, so the matrix can
  # change without anyone remembering to edit branch protection.
  #
  # `if: always()` is load-bearing, not defensive habit. Without it, GitHub skips this job the
  # moment a job it needs fails, a skipped check counts as a passing one for branch protection, and
  # the gate would go green in exactly the case it exists to catch. So it always runs and reads the
  # results itself, where `skipped` and `cancelled` are failures too: a job that did not run has not
  # passed.
  #
  # `needs` is checked, not trusted. A job added to this file but not listed here would be gated by
  # nothing, so scripts/lib/ci-gate.mjs fails the drift job when the two disagree.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs:
      - conformance
      - unit-python
      - smoke
      - unit-node
      - schema
      - corpus
      - drift
      - audit
      - build-site
    steps:
      - name: Every job this gate depends on succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "ci-ok: at least one job did not succeed."
          echo '${{ toJSON(needs) }}'
          exit 1
