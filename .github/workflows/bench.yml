name: Bench

# workflow_dispatch only, by design (S-07 CI-pipeline spec; see _local/initial-plan/04-ci-plan.md,
# a local planning archive, not shipped): judged-lane runs cost money and are non-deterministic, so
# they never run on push/PR, since that would be green checkmarks over variance. This workflow is a
# scheduler for one script, same as ci.yml: the job is a single documented command, reproducible
# locally (AGENTS.md "Checks").
#
# --dry-run validates inputs and wiring without calling any model and without any credential at
# all (AC-3). A live run reaches the model through the Claude Code CLI rather than the Anthropic
# API, so it needs NO API key: it authenticates from a Claude subscription via a `claude
# setup-token` credential in CLAUDE_CODE_OAUTH_TOKEN (ADR 0030, probed on a clean runner
# 2026-08-08). run_bench.py checks for the CLI up front, so a misconfigured dispatch fails loudly
# and names the remedy instead of failing at the first model call.
#
# Every dispatch names its own --out-dir, and that is load-bearing rather than tidy. run_bench.py
# defaults --out-dir to bench/results/runs, which holds the committed measurement evidence every
# published figure is recomputed from, and its immutability guard refuses any directory that
# already holds envelopes. A dispatch passing no --out-dir therefore reached that guard and exited
# 1 before any model call. The guard sits after --dry-run returns, so a dry run was unaffected and
# the failure was invisible to the only dispatch this workflow had ever had.
#
# Results are never pushed directly to main: a live run that produces new envelopes commits them to
# a fresh branch and pushes only that branch, for review as a diff.

on:
  workflow_dispatch:
    inputs:
      skills:
        description: 'Comma-separated skill names, or "all"'
        required: false
        default: 'all'
        type: string
      k:
        description: 'Repeat count per skill per artifact (consistency measurement)'
        required: false
        default: '5'
        type: string
      tiers:
        description: 'Comma-separated model tier list (blank = the two pinned tiers)'
        required: false
        default: ''
        type: string
      out_dir:
        description: 'Where envelopes are written. Blank uses a fresh per-dispatch directory; the harness refuses one that already holds envelopes.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run: validate wiring without calling any model (no secret required)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install the Claude Code CLI (the harness reaches the model through it, not the API)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the bench harness
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Keyed on the run id so two dispatches can never collide, and kept under bench/results/
          # because the publish step below stages exactly that path.
          BENCH_OUT_DIR: ${{ inputs.out_dir || format('bench/results/runs-dispatch-{0}', github.run_id) }}
        run: python bench/run_bench.py --skills "${{ inputs.skills }}" --k "${{ inputs.k }}" --tiers "${{ inputs.tiers }}" --out-dir "$BENCH_OUT_DIR" ${{ inputs.dry_run && '--dry-run' || '' }}

      # `!cancelled()` rather than a bare condition, because a partial failure is the case where
      # publishing matters most. On 2026-08-17 a 40-cell dispatch produced 37 valid envelopes over
      # 72 minutes of paid model time, three cells failed, this step was skipped as a consequence,
      # and every one of those envelopes was discarded with the runner. Evidence a run paid for
      # must survive the run failing; a results branch is reviewed as a diff before anything is
      # merged, so publishing a partial set costs nothing and losing it costs the whole run.
      - name: Publish results as a branch diff (never a direct push)
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- bench/results)" ]; then
            echo "no bench result changes to publish"
            exit 0
          fi
          BRANCH="bench-results/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add bench/results
          git commit -m "bench: results for dispatch run ${GITHUB_RUN_ID}"
          git push origin "$BRANCH"
          echo "pushed results branch: $BRANCH (open a PR to review before merging)"
