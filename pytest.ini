[pytest]
# --import-mode=importlib: every skill's scripts/tests/ is a package named
# literally "tests" (docs/internal/skill-template.md, "Directory shape",
# scripts/tests/__init__.py), because the skill directory above it has a
# hyphen and cannot itself be a package, and "scripts/" carries no
# __init__.py of its own. Under pytest's default "prepend" import mode,
# that makes every skill's test package resolve to the same dotted name
# "tests", so the second skill's scripts/tests/__init__.py to be collected
# fails with "ModuleNotFoundError: No module named 'tests.test_checks_
# <domain>'" (Python has already bound sys.modules["tests"] to the first
# skill's package, whose __path__ does not contain the second skill's
# files) rather than the "import file mismatch" collision the domain-
# suffixed test-module basename rule (skill-template.md, "scripts/tests/")
# was written to prevent. Discovered when critique-argument became the
# second skill (after the skills/_template-fixture/critique-toy fixture)
# to ship a real scripts/tests/ directory; the domain-suffix rule alone
# only fixes the file-basename collision, not this package-name collision
# one level up. --import-mode=importlib imports every test file by its own
# absolute file path instead of a package-relative dotted name, so no two
# skills' identically-named "tests" packages are ever asked to share one
# sys.modules entry; it needs no per-skill workaround and is pytest's own
# documented fix for this exact shape of collision.
addopts = --import-mode=importlib
# `skills/*/scripts/tests` is a glob (pytest >= 7 expands testpaths globs) so a
# P2 pipeline adding skills/critique-<domain>/ gets its scripted-lane suite
# collected with no edit here. A glob that matches nothing is not an error, so
# the entry is harmless before the first skill lands. The template fixture is
# listed explicitly because it sits one level deeper, under the
# _template-fixture/ wrapper that keeps it out of the shipped skill inventory
# (see skills/_template-fixture/README.md).
testpaths =
    contract/tests
    bench/generator/tests
    bench/metrics/tests
    bench/baseline/tests
    bench/tests
    skills/_shared/tests
    skills/*/scripts/tests
    skills/_template-fixture/critique-toy/scripts/tests
    scripts/tests
