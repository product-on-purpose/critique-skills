# Permitted inter-component invocations (Standard sec 3.6).
#
# Every critique-<domain> skill delegates its critique to the critique-critic subagent, for a
# clean-context run (methodology section 7). The revision-loop workflow,
# _workflows/critique-revision-loop.md, runs that critique on its first invocation and again on its
# second, so these seven edges are the chain it depends on (N4 decision D6). Each edge carries an
# eval set under evals/, executed by skills/_shared/tests/test_revision_loop_evals.py.
critique-accessibility:
  - critique-critic
critique-argument:
  - critique-critic
critique-clarity:
  - critique-critic
critique-docs:
  - critique-critic
critique-forms:
  - critique-critic
critique-microcopy:
  - critique-critic
critique-usability:
  - critique-critic
