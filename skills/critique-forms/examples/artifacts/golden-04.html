<!DOCTYPE html>
<html lang="en">
<head>
<title>Edit your profile</title>
</head>
<body>
<main>
<h1>Edit your profile</h1>
<p>All fields are required.</p>
<form id="profile" action="/profile" method="post">
  <div>
    <label for="given">First name</label>
    <input id="given" name="given_name" autocomplete="given-name" autocorrect="off" spellcheck="false" required>
  </div>
  <div>
    <label for="family">Last name</label>
    <input id="family" name="family_name" autocomplete="family-name" autocorrect="off" spellcheck="false" required>
  </div>
  <div>
    <label for="mobile">Mobile number</label>
    <input id="mobile" name="mobile" type="text" autocomplete="tel" required>
    <p>We will text you only about changes to your bookings.</p>
  </div>
  <div>
    <label for="website">Website</label>
    <input id="website" name="website" type="text" required>
  </div>
  <fieldset>
    <legend>Date of birth</legend>
    <label for="dob-day">Day</label>
    <select id="dob-day" name="dob_day" autocomplete="bday-day" required>
      <option value="">Day</option>
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
      <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
      <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
      <option>21</option><option>22</option><option>23</option><option>24</option><option>25</option>
      <option>26</option><option>27</option><option>28</option><option>29</option><option>30</option>
      <option>31</option>
    </select>
    <label for="dob-month">Month</label>
    <select id="dob-month" name="dob_month" autocomplete="bday-month" required>
      <option value="">Month</option>
      <option>January</option><option>February</option><option>March</option><option>April</option>
      <option>May</option><option>June</option><option>July</option><option>August</option>
      <option>September</option><option>October</option><option>November</option><option>December</option>
    </select>
    <label for="dob-year">Year</label>
    <select id="dob-year" name="dob_year" autocomplete="bday-year" required>
      <option value="">Year</option>
      <option>2008</option><option>2007</option><option>2006</option><option>2005</option><option>2004</option>
      <option>2003</option><option>2002</option><option>2001</option><option>2000</option><option>1999</option>
      <option>1998</option><option>1997</option><option>1996</option><option>1995</option><option>1994</option>
      <option>1993</option><option>1992</option><option>1991</option><option>1990</option><option>1989</option>
      <option>1988</option><option>1987</option><option>1986</option><option>1985</option><option>1984</option>
      <option>1983</option><option>1982</option><option>1981</option><option>1980</option><option>1979</option>
      <option>1978</option><option>1977</option><option>1976</option><option>1975</option><option>1974</option>
      <option>1973</option><option>1972</option><option>1971</option><option>1970</option><option>1969</option>
    </select>
  </fieldset>
  <button type="submit">Save profile</button>
</form>
</main>
</body>
</html>
