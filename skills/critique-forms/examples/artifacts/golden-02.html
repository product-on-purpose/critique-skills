<!DOCTYPE html>
<html lang="en">
<head>
<title>Delivery details</title>
</head>
<body>
<main>
<h1>Where should we deliver your order?</h1>
<p>All fields are required.</p>
<form id="delivery" action="/checkout/delivery" method="post">
  <div>
    <label for="recipient">Full name</label>
    <input id="recipient" name="recipient" autocomplete="name" autocorrect="off" spellcheck="false" required>
  </div>
  <div>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
  </div>
  <div>
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" pattern="[0-9]+" required>
  </div>
  <div>
    <label for="house-number">House number</label>
    <input id="house-number" name="house_number" required>
  </div>
  <div>
    <label for="street">Street</label>
    <input id="street" name="street" autocomplete="address-line1" autocorrect="off" spellcheck="false" required>
  </div>
  <div>
    <label for="city">Town or city</label>
    <input id="city" name="city" required>
  </div>
  <div>
    <label for="county">County</label>
    <input id="county" name="county" required>
  </div>
  <div>
    <label for="postcode">Postcode</label>
    <input id="postcode" name="postcode" autocomplete="off" required>
  </div>
  <div>
    <button type="reset">Reset</button>
    <button type="submit">Continue to payment</button>
  </div>
</form>
</main>
</body>
</html>
