<!DOCTYPE html>
<html lang="en">
<head>
<title>Join the Tidewater Rowing Club</title>
</head>
<body>
<main>
<h1>Join the Tidewater Rowing Club</h1>
<p>All fields are required.</p>
<form id="join" action="/join" method="post">
  <div>
    <label for="full-name">Full name</label>
    <input id="full-name" name="full_name" autocomplete="name" autocorrect="off" spellcheck="false" required>
  </div>
  <div>
    <label for="email">Email address</label>
    <input id="email" name="email" type="text" autocomplete="email" autocorrect="off" spellcheck="false" autocapitalize="none" required>
  </div>
  <div>
    <label for="squad">Squad</label>
    <select id="squad" name="squad" required>
      <option value="">Choose a squad</option>
      <option>Novice</option>
      <option>Intermediate</option>
      <option>Masters</option>
    </select>
  </div>
  <div>
    <label for="password">Create a password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
  </div>
  <div>
    <label for="password-again">Confirm password</label>
    <input id="password-again" name="password_again" type="password" autocomplete="new-password" required>
  </div>
  <button type="submit">Submit</button>
</form>
</main>
</body>
</html>
