<!DOCTYPE html>
<html lang="en">
<head>
<title>Sign in to Larkspur Library</title>
<style>
.entry { font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>Sign in to Larkspur Library</h1>
<form id="sign-in" action="/sign-in" method="post">
  <div>
    <label for="username">Username *</label>
    <input id="username" class="entry" name="username" autocomplete="username" required>
  </div>
  <div>
    <label for="card">Library card number *</label>
    <input id="card" class="entry" name="membership_number" placeholder="Must be 10 digits" required>
  </div>
  <div>
    <label for="email">Email for reminders</label>
    <input id="email" class="entry" name="email" type="email" autocomplete="email" size="15">
  </div>
  <fieldset>
    <legend>Enter the code we sent to your phone</legend>
    <input id="code-1" name="code_1" maxlength="1" inputmode="numeric" aria-label="Code digit 1">
    <input id="code-2" name="code_2" maxlength="1" inputmode="numeric" aria-label="Code digit 2">
    <input id="code-3" name="code_3" maxlength="1" inputmode="numeric" aria-label="Code digit 3">
    <input id="code-4" name="code_4" maxlength="1" inputmode="numeric" aria-label="Code digit 4">
  </fieldset>
  <button type="submit">Sign in</button>
</form>
</main>
</body>
</html>
