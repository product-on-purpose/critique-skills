<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account settings mockup</title>
</head>
<body>
<h1>Account settings</h1>

<nav>
  <a href="#profile-tab">Profile</a>
  <a href="#notifications-tab">Notifications</a>
</nav>

<section id="profile-tab">
  <h2>Profile</h2>
  <form>
    <label for="display-name">Display name</label>
    <input id="display-name" type="text" value="Jordan Rivera">
    <button type="submit">Save</button>
  </form>
  <a href="#notifications-tab">Go to notification settings</a>
</section>

<section id="notifications-tab">
  <h2>Notifications</h2>
  <form>
    <label for="digest-frequency">Digest frequency</label>
    <select id="digest-frequency">
      <option>Daily</option>
      <option>Weekly</option>
    </select>
    <button type="submit">Apply changes</button>
  </form>
  <a href="#workspace-deleted">Delete this workspace</a>
</section>

<section id="workspace-deleted">
  <h2>Workspace deleted</h2>
  <p>This workspace and everything in it has been permanently removed.</p>
</section>

</body>
</html>
