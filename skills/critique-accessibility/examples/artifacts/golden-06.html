<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riverbend Water Utility: Account Settings</title>
<style>
@media (orientation: portrait) {
  #secondary-widget { display: none; }
}
#icon-btn { width: 18px; height: 18px; padding: 0; }
#footer-link:focus { outline: none; }
</style>
</head>
<body>
<a href="#main-content">Skip to main content</a>
<header>
<nav><a href="/billing">View billing history</a></nav>
</header>
<main id="main-content">
<h1>Account settings</h1>
<p>Update your contact details and notification preferences below.</p>

<div id="secondary-widget">
<h2>Usage chart</h2>
<p>A chart comparing this month's usage against last month's appears here on a wide or landscape screen.</p>
</div>

<form id="settings-form">
<label for="email">Email address</label>
<input id="email" type="email">

<button id="icon-btn" type="button">Refresh</button>

<p id="save-status">Changes saved</p>

<button type="submit">Save settings</button>
</form>

<p><a id="footer-link" href="/accessibility">Read our accessibility statement</a></p>
</main>
</body>
</html>
