<!DOCTYPE html>
<html lang="en">
<head>

<title>Riverbend Water Utility: Report a Leak</title>

.required-label { color: #cc0000; }
</style>
</head>
<body>
<a href="#main-content">Skip to main content</a>
<header>
<nav>
<a href="/billing">View billing history</a>
<a href="/outages">Report a service outage</a>
</nav>
</header>
<main id="main-content">
<h1>Report a leak</h1>
<p>Tell us where the leak is and how to reach you. A dispatcher calls back within one business day.</p>

<h2>Details</h2>
<p>Fields shown in red are required. Everything else is optional.</p>

<form>
<label class="required-label" for="address">Service address</label>
<input id="address" type="text">

<label class="required-label" for="phone">Callback number</label>
<input id="phone" type="tel">

<label for="notes">Anything else we should know</label>
<textarea id="notes"></textarea>

<label for="account">Account number</label>
<input id="account" type="text" aria-invalid="true">
<span class="error-text">Error</span>

<button type="submit">Send report</button>
</form>
</main>
</body>
</html>
