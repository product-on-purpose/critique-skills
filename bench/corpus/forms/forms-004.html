<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create your Meridian Outfitters account</title>
</head>
<body>
<h1>Set up your account</h1>
<form id="form">
  <div id="row-name">
    <label id="name-label" for="name-input">Full name</label>
    <input id="name-input" name="full_name" type="text" autocomplete="name" autocorrect="off" spellcheck="false" required="">
  </div>
  <div id="row-email">
    <label id="email-label" for="email-input">Email address</label>
    <input id="email-input" name="email" type="email" autocomplete="email" required="">
  </div>
  <div id="row-password">
    <label id="password-label" for="password-input">Create a password</label>
    <input id="password-input" name="password" type="password" autocomplete="new-password" minlength="8" required="">
  </div>
  <div id="row-street">
    <label id="street-label" for="street-input">Street address</label>
    <input id="street-input" name="street_address" type="text" autocomplete="address-line1" autocorrect="off" spellcheck="false" required="">
  </div>
  <div id="row-phone">
    <label id="phone-label" for="phone-input">Phone number</label>
    <input id="phone-input" name="phone" type="tel" autocomplete="tel" required="">
    <p>We will text you about delivery updates.</p>
  </div>
  <div id="row-phone2">
    <label id="phone2-label" for="phone2-input">Secondary phone (optional)</label>
    <input id="phone2-input" name="phone_secondary" type="tel" autocomplete="tel">
  </div>
  <div id="row-website">
    <label id="website-label" for="website-input">Company website</label>
    <input id="website-input" name="website" type="url" required="">
  </div>
  <div id="row-member">
    <label id="member-label" for="member-input">Membership number (8 digits)</label>
    <input id="member-input" name="membership_number" type="text" inputmode="numeric" placeholder="Must be 8 digits" required="">
  </div>
  <div id="row-acctnum">
    <label id="acctnum-label" for="acctnum-input">Account number</label>
    <input id="acctnum-input" name="account_number" type="text" inputmode="numeric" required="">
  </div>
  <div id="row-postal">
    <label id="postal-label" for="postal-input">Postal code</label>
    <input id="postal-input" name="postal_code" type="text" autocomplete="postal-code" required="">
  </div>
  <div id="row-shipspeed">
    <label id="shipspeed-label" for="shipspeed-select">Preferred shipping speed</label>
    <select id="shipspeed-select" required="">
      <option>Standard</option>
      <option>Express</option>
      <option>Overnight</option>
      <option>Next-day</option>
      <option>International</option>
    </select>
  </div>
  <div id="row-legalname">
    <label id="legalname-label" for="legalname-input">Your name</label>
    <input id="legalname-input" name="legal_name" type="text" autocomplete="name" autocorrect="off" spellcheck="false" required="">
  </div>
  <div id="row-org">
    <label id="org-label" for="org-input">Organization name</label>
    <input id="org-input" name="organization" type="text" style="font-size:16px" required="">
  </div>
  <div id="row-contacttime">
    <label id="contacttime-label" for="contacttime-input" style="display:block">Preferred contact time</label>
    <input id="contacttime-input" name="contact_time" type="text" required="">
  </div>
  <button id="viewdetails-btn" type="button" style="padding:12px 20px;font-size:16px">View details</button>
  <button id="submit-btn" type="submit">Create account</button>
</form>
</body>
</html>
