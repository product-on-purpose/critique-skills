<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join Meridian Outfitters</title>
</head>
<body>
<h1>Create your account</h1>
<form id="form">
  <div id="row-name">
    <label id="name-label" for="name-input">Full name</label>
    <input id="name-input" name="full_name" type="text" autocomplete="name" autocorrect="off" spellcheck="false" required="">
  </div>
  <div id="row-email">
    <label id="email-label" for="email-input">Email address</label>
    <input id="email-input" name="email" type="email" autocomplete="email" required="">
  </div>
  <div id="row-password">
    <label id="password-label" for="password-input">Create a password</label>
    <input id="password-input" name="password" type="password" autocomplete="new-password" minlength="8" required="">
  </div>
  <div id="row-street">
    <label id="street-label" for="street-input">Street address</label>
    <input id="street-input" name="street_address" type="text" autocomplete="address-line1" autocorrect="off" spellcheck="false" required="">
  </div>
  <div id="row-phone">
    <label id="phone-label" for="phone-input">Phone number</label>
    <input id="phone-input" name="phone" type="tel" autocomplete="tel" required="">
    <p>We will text you about delivery updates.</p>
  </div>
  <div id="row-phone2">
    <label id="phone2-label" for="phone2-input">Secondary phone (optional)</label>
    <input id="phone2-input" name="phone_secondary" type="tel" autocomplete="tel" pattern="[0-9]+">
  </div>
  <div id="row-website">
    <label id="website-label" for="website-input">Company website</label>
    <input id="website-input" name="website" required="" type="text">
  </div>
  <div id="row-member">
    <label id="member-label" for="member-input">Membership number (8 digits)</label>
    <input id="member-input" name="membership_number" type="text" inputmode="numeric" placeholder="Must be 8 digits" required="">
  </div>
  <div id="row-acctnum">
    <label id="acctnum-label" for="acctnum-input">Account number</label>
    <input id="acctnum-input" name="account_number" type="text" inputmode="numeric" required="">
  </div>
  <div id="row-postal">
    <label id="postal-label" for="postal-input">Postal code</label>
    <input id="postal-input" name="postal_code" type="text" autocomplete="postal-code" required="" size="3">
  </div>
  <div id="row-shipspeed">
    <label id="shipspeed-label" for="shipspeed-select">Preferred shipping speed</label>
    <select id="shipspeed-select" required="">
      <option>Standard</option>
      <option>Express</option>
      <option>Overnight</option>
      <option>Next-day</option>
      <option>International</option>
    </select>
  </div>
  <div id="row-legalname">
    <label id="legalname-label" for="legalname-input">Your name</label>
    <input id="legalname-input" name="legal_name" type="text" autocomplete="name" autocorrect="off" spellcheck="false" required="">
  </div>
  <div id="row-org">
    <label id="org-label" for="org-input">Organization name</label>
    <input id="org-input" name="organization" type="text" required="" style="font-size:13px">
  </div>
  <div id="row-contacttime">
    <label id="contacttime-label" for="contacttime-input" style="display:inline-block;float:left;width:140px">Preferred contact time</label>
    <input id="contacttime-input" name="contact_time" type="text" required="">
  </div>
  <button id="viewdetails-btn" type="button" style="padding:12px 20px;font-size:16px">View details</button>
  <fieldset id="row-dob">
    <legend>Date of birth</legend>
    <label id="dob-day-label" for="dob-day-select">Day</label>
    <select id="dob-day-select" autocomplete="bday-day" required="">
      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
      <option>6</option>
      <option>7</option>
      <option>8</option>
      <option>9</option>
      <option>10</option>
      <option>11</option>
      <option>12</option>
      <option>13</option>
      <option>14</option>
      <option>15</option>
      <option>16</option>
      <option>17</option>
      <option>18</option>
      <option>19</option>
      <option>20</option>
      <option>21</option>
      <option>22</option>
      <option>23</option>
      <option>24</option>
      <option>25</option>
      <option>26</option>
      <option>27</option>
      <option>28</option>
      <option>29</option>
      <option>30</option>
      <option>31</option>
    </select>
    <label id="dob-month-label" for="dob-month-select">Month</label>
    <select id="dob-month-select" autocomplete="bday-month" required="">
      <option>January</option>
      <option>February</option>
      <option>March</option>
      <option>April</option>
      <option>May</option>
      <option>June</option>
      <option>July</option>
      <option>August</option>
      <option>September</option>
      <option>October</option>
      <option>November</option>
      <option>December</option>
    </select>
    <label id="dob-year-label" for="dob-year-select">Year</label>
    <select id="dob-year-select" autocomplete="bday-year" required="">
      <option>1950</option>
      <option>1951</option>
      <option>1952</option>
      <option>1953</option>
      <option>1954</option>
      <option>1955</option>
      <option>1956</option>
      <option>1957</option>
      <option>1958</option>
      <option>1959</option>

      <option>2009</option>
    </select>
  </fieldset>
  <button id="submit-btn" type="submit">Create account</button>
</form>
</body>
</html>
